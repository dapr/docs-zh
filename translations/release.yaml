# release.yaml — release configuration for Dapr docs v1.17 (translation repo dapr/docs-zh, branch v1.17_content).
# Maintained by hand. Structure: repos/agent-skills/release.example.yaml. Read by dapr-docs-* skills; never rewritten by them.

schema: 1
version: v1.17

# zh:data:sync regenerates data/ from repos/v1.17; the translation skills do not commit it.
syncOutputPaths:
  - data/

upstreamPr:
  forkDocs:
    path: repos/fork-docs
    submodulePath: translations/docs-zh
    upstreamUrl: https://github.com/dapr/docs.git
    upstreamBranch: v1.17
